<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcionPet · Demo</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/logo-icono.png" alt="ArcionPet"></div>
        <div class="brand-text">
          <strong>Arcion<span>Pet</span></strong>
          <span>Veterinaria · red EISPLUS</span>
        </div>
        <button class="bell" id="bell" title="Notificaciones" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="bell-badge" id="bell-badge">0</span>
        </button>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="user-switch" id="user-switch" title="Cambiar de rol (demo)">
          <div class="avatar" id="user-avatar">LG</div>
          <div class="who"><strong id="user-nombre">Dra. Laura Giménez</strong><span id="user-rol">Veterinario/a</span></div>
        </button>
        <button class="icon-btn reset" id="reset-demo" title="Reiniciar datos de la demo" aria-label="Reiniciar demo">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="disclaimer">Herramienta de <b>apoyo</b> al diagnóstico. No sustituye el criterio del médico veterinario, que revisa y firma cada informe.</div>
      <button class="menu-toggle" id="menu-toggle" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <main class="content" id="view"></main>
    </div>
  </div>

  <div class="notif-panel" id="notif-panel" hidden></div>

  <!-- ARCION: asistente flotante -->
  <button class="arcion-fab" id="arcion-fab" title="Preguntale a ARCION">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
    <span>ARCION</span>
  </button>
  <section class="arcion-drawer" id="arcion-drawer" hidden></section>

  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toast-wrap" id="toasts"></div>

  <script src="js/dominio/migraciones.js"></script>
  <script src="js/dominio/permisos.js"></script>
  <script src="js/dominio/tutores.js"></script>
  <script src="js/dominio/inventario.js"></script>
  <script src="js/dominio/ventas.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/vendor/tf.min.js"></script>
  <script src="js/model/test-set.js"></script>
  <script src="js/model/transfer_mobilenetv2.js"></script>
  <script src="js/model/transfer_fase1.js"></script>
  <script src="js/cnn.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vistas/comun.js"></script>
  <script src="js/vistas/inicio.js"></script>
  <script src="js/vistas/clinica.js"></script>
  <script src="js/vistas/diagnostico.js"></script>
  <script src="js/vistas/inventario.js"></script>
  <script src="js/vistas/ventas.js"></script>
  <script src="js/vistas/servicios.js"></script>
  <script src="js/vistas/red.js"></script>
  <script src="js/arcion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
